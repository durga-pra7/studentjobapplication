<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Opportunities</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:40px 20px;
}

.wrapper{
    max-width:800px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    overflow:hidden;
}

.header{
    background:#1e3a8a;
    color:white;
    padding:25px;
    text-align:center;
}

.job-details{
    padding:25px;
    border-bottom:1px solid #ddd;
}

.job-details h3{
    color:#1e3a8a;
    margin-bottom:15px;
}

.job-details ul{
    list-style:none;
}

.job-details li{
    margin-bottom:10px;
}

.form-section{
    padding:25px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="wrapper">

```
<div class="header">
    <h1>Career Opportunities Portal</h1>
    <p>Join our growing technology team</p>
</div>

<div class="job-details">
    <h3>Frontend Developer</h3>

    <ul>
        <li><strong>Company:</strong> TechNova Solutions</li>
        <li><strong>Location:</strong> Bengaluru</li>
        <li><strong>Experience:</strong> Fresher - 2 Years</li>
        <li><strong>Salary:</strong> ₹4 LPA - ₹8 LPA</li>
        <li><strong>Skills:</strong> HTML, CSS, JavaScript, React</li>
    </ul>
</div>

<div class="form-section">
    <h3>Application Form</h3>

    <form id="jobForm">

        <input type="text" id="fullName" placeholder="Enter Full Name" required>
        <input type="email" id="email" placeholder="Enter Email" required>
        <input type="text" id="phone" placeholder="Enter Mobile Number" required>
        <input type="text" id="qualification" placeholder="Qualification" required>
        <input type="text" id="skills" placeholder="Technical Skills">
        <textarea id="coverLetter" rows="5" placeholder="Why should we hire you?"></textarea>

        <button type="submit">Submit Application</button>

    </form>

    <p id="message"></p>
</div>
```

</div>

<script>
document.getElementById("jobForm").addEventListener("submit", async function(e){

    e.preventDefault();

    document.getElementById("message").innerText =
    "Application submitted successfully!";
});
</script>

</body>
</html>
